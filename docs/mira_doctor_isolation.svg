<svg width="100%" viewBox="0 0 680 440">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Incoming calls row -->
<g class="node c-gray">
  <rect x="40" y="30" width="130" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="105" y="52" text-anchor="middle" dominant-baseline="central">+91-XXXX (Dr.1)</text>
</g>
<g class="node c-gray">
  <rect x="275" y="30" width="130" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">+91-YYYY (Dr.2)</text>
</g>
<g class="node c-gray">
  <rect x="510" y="30" width="130" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="575" y="52" text-anchor="middle" dominant-baseline="central">+91-ZZZZ (Dr.3)</text>
</g>

<!-- Arrows down to FusionPBX -->
<line x1="105" y1="74" x2="220" y2="128" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="74" x2="340" y2="128" class="arr" marker-end="url(#arrow)"/>
<line x1="575" y1="74" x2="460" y2="128" class="arr" marker-end="url(#arrow)"/>

<!-- FusionPBX -->
<g class="node c-teal">
  <rect x="170" y="130" width="340" height="50" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="152" text-anchor="middle" dominant-baseline="central">FusionPBX</text>
  <text class="ts" x="340" y="170" text-anchor="middle" dominant-baseline="central">DID → doctor_id mapping in dialplan</text>
</g>

<!-- Arrow down to router -->
<line x1="340" y1="180" x2="340" y2="218" class="arr" marker-end="url(#arrow)"/>

<!-- Router/dispatcher -->
<g class="node c-amber">
  <rect x="200" y="220" width="280" height="50" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="242" text-anchor="middle" dominant-baseline="central">Mira router</text>
  <text class="ts" x="340" y="260" text-anchor="middle" dominant-baseline="central">Loads ONLY that doctor's context</text>
</g>

<!-- Three isolated context boxes -->
<line x1="260" y1="270" x2="115" y2="318" class="arr" stroke="#EF9F27" marker-end="url(#arrow)"/>
<line x1="340" y1="270" x2="340" y2="318" class="arr" stroke="#EF9F27" marker-end="url(#arrow)"/>
<line x1="420" y1="270" x2="565" y2="318" class="arr" stroke="#EF9F27" marker-end="url(#arrow)"/>

<!-- Doctor 1 context -->
<g class="node c-blue">
  <rect x="40" y="320" width="150" height="90" rx="8" stroke-width="0.5"/>
  <text class="th" x="115" y="344" text-anchor="middle" dominant-baseline="central">Dr. 1 context</text>
  <text class="ts" x="115" y="364" text-anchor="middle">Cardiology, Andheri</text>
  <text class="ts" x="115" y="382" text-anchor="middle">Mon-Sat 10-6pm</text>
  <text class="ts" x="115" y="400" text-anchor="middle">dr1_calendar_id</text>
</g>

<!-- Doctor 2 context -->
<g class="node c-purple">
  <rect x="265" y="320" width="150" height="90" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="344" text-anchor="middle" dominant-baseline="central">Dr. 2 context</text>
  <text class="ts" x="340" y="364" text-anchor="middle">Pediatrics, Bandra</text>
  <text class="ts" x="340" y="382" text-anchor="middle">Tue-Sun 9-5pm</text>
  <text class="ts" x="340" y="400" text-anchor="middle">dr2_calendar_id</text>
</g>

<!-- Doctor 3 context -->
<g class="node c-coral">
  <rect x="490" y="320" width="150" height="90" rx="8" stroke-width="0.5"/>
  <text class="th" x="565" y="344" text-anchor="middle" dominant-baseline="central">Dr. 3 context</text>
  <text class="ts" x="565" y="364" text-anchor="middle">Orthopedics, Pune</text>
  <text class="ts" x="565" y="382" text-anchor="middle">Mon-Fri 11-7pm</text>
  <text class="ts" x="565" y="400" text-anchor="middle">dr3_calendar_id</text>
</g>

<!-- Isolation marker -->
<line x1="220" y1="310" x2="250" y2="310" stroke="var(--color-border-primary)" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="420" y1="310" x2="450" y2="310" stroke="var(--color-border-primary)" stroke-width="1" stroke-dasharray="3 3"/>
<text class="ts" x="340" y="308" text-anchor="middle">— hard isolated · no cross-context —</text>

</svg>