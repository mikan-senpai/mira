<svg width="100%" viewBox="0 0 680 820">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- LAYER LABELS -->
<text class="ts" x="18" y="58" fill="#888">CALLER</text>
<text class="ts" x="18" y="170" fill="#888">TELEPHONY</text>
<text class="ts" x="18" y="320" fill="#888">AI VOICE</text>
<text class="ts" x="18" y="530" fill="#888">BRAIN</text>
<text class="ts" x="18" y="690" fill="#888">NOTIFY</text>

<!-- DIVIDER LINES -->
<line x1="88" y1="100" x2="648" y2="100" stroke="var(--color-border-tertiary)" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="88" y1="220" x2="648" y2="220" stroke="var(--color-border-tertiary)" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="88" y1="440" x2="648" y2="440" stroke="var(--color-border-tertiary)" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="88" y1="640" x2="648" y2="640" stroke="var(--color-border-tertiary)" stroke-width="0.5" stroke-dasharray="4 4"/>

<!-- CALLER -->
<g class="node c-gray" onclick="">
  <rect x="260" y="32" width="160" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="54" text-anchor="middle" dominant-baseline="central">Patient calls</text>
</g>

<!-- ARROW: caller to PBX -->
<line x1="340" y1="76" x2="340" y2="118" class="arr" marker-end="url(#arrow)"/>

<!-- PBX -->
<g class="node c-teal">
  <rect x="170" y="120" width="340" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="142" text-anchor="middle" dominant-baseline="central">FusionPBX (on-premises)</text>
  <text class="ts" x="340" y="162" text-anchor="middle" dominant-baseline="central">Routes call · DID → Doctor profile lookup</text>
</g>

<!-- PBX branches: doctor picks up vs no answer -->
<line x1="250" y1="176" x2="170" y2="232" class="arr" stroke="var(--color-border-secondary)" marker-end="url(#arrow)"/>
<text class="ts" x="170" y="220" text-anchor="middle">Doctor picks up</text>

<line x1="430" y1="176" x2="510" y2="232" class="arr" stroke="#EF9F27" marker-end="url(#arrow)"/>
<text class="ts" x="530" y="220" text-anchor="middle">No answer</text>

<!-- Normal call box -->
<g class="node c-gray">
  <rect x="98" y="234" width="144" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="170" y="256" text-anchor="middle" dominant-baseline="central">Normal call</text>
</g>

<!-- MIRA kicks in -->
<g class="node c-amber">
  <rect x="434" y="234" width="160" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="514" y="256" text-anchor="middle" dominant-baseline="central">Mira takes over</text>
</g>

<!-- Arrow: Mira down to AI layer -->
<line x1="514" y1="278" x2="514" y2="298" class="arr" stroke="#EF9F27" marker-end="url(#arrow)"/>
<line x1="514" y1="298" x2="340" y2="298" class="arr" stroke="#EF9F27" marker-end="url(#arrow)"/>
<line x1="340" y1="298" x2="340" y2="314" class="arr" stroke="#EF9F27" marker-end="url(#arrow)"/>

<!-- AI VOICE PIPELINE -->
<g class="c-purple">
  <rect x="110" y="316" width="460" height="110" rx="12" stroke-width="0.5"/>
</g>
<text class="th" x="340" y="338" text-anchor="middle" dominant-baseline="central">Pipecat voice pipeline</text>

<!-- STT -->
<g class="node c-blue">
  <rect x="126" y="350" width="120" height="60" rx="8" stroke-width="0.5"/>
  <text class="th" x="186" y="372" text-anchor="middle" dominant-baseline="central">STT</text>
  <text class="ts" x="186" y="390" text-anchor="middle" dominant-baseline="central">Sarvam Saarika v2</text>
</g>

<!-- Arrow STT → LLM -->
<line x1="246" y1="380" x2="276" y2="380" class="arr" marker-end="url(#arrow)"/>

<!-- LLM -->
<g class="node c-purple">
  <rect x="278" y="350" width="124" height="60" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="372" text-anchor="middle" dominant-baseline="central">LLM</text>
  <text class="ts" x="340" y="390" text-anchor="middle" dominant-baseline="central">Ollama (open source)</text>
</g>

<!-- Arrow LLM → TTS -->
<line x1="402" y1="380" x2="428" y2="380" class="arr" marker-end="url(#arrow)"/>

<!-- TTS -->
<g class="node c-teal">
  <rect x="430" y="350" width="124" height="60" rx="8" stroke-width="0.5"/>
  <text class="th" x="492" y="372" text-anchor="middle" dominant-baseline="central">TTS</text>
  <text class="ts" x="492" y="390" text-anchor="middle" dominant-baseline="central">Sarvam Bulbul v3</text>
</g>

<!-- Audio back arrow -->
<line x1="340" y1="426" x2="340" y2="452" class="arr" marker-end="url(#arrow)"/>

<!-- AGENT LOGIC BRAIN LAYER -->
<g class="c-coral">
  <rect x="110" y="454" width="460" height="170" rx="12" stroke-width="0.5"/>
</g>
<text class="th" x="340" y="476" text-anchor="middle" dominant-baseline="central">Mira agent logic (FastAPI)</text>

<!-- Doctor context -->
<g class="node c-coral">
  <rect x="126" y="490" width="130" height="120" rx="8" stroke-width="0.5"/>
  <text class="th" x="191" y="512" text-anchor="middle" dominant-baseline="central">Doctor context</text>
  <text class="ts" x="191" y="530" text-anchor="middle">Name, location</text>
  <text class="ts" x="191" y="548" text-anchor="middle">Specialisation</text>
  <text class="ts" x="191" y="566" text-anchor="middle">Working hours</text>
  <text class="ts" x="191" y="584" text-anchor="middle">Strict isolation</text>
</g>

<!-- Conversation flow -->
<g class="node c-pink">
  <rect x="278" y="490" width="124" height="120" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="512" text-anchor="middle" dominant-baseline="central">Conversation</text>
  <text class="ts" x="340" y="530" text-anchor="middle">Greet patient</text>
  <text class="ts" x="340" y="548" text-anchor="middle">Understand need</text>
  <text class="ts" x="340" y="566" text-anchor="middle">Suggest slots</text>
  <text class="ts" x="340" y="584" text-anchor="middle">Confirm booking</text>
</g>

<!-- Calendar integration -->
<g class="node c-green">
  <rect x="424" y="490" width="130" height="120" rx="8" stroke-width="0.5"/>
  <text class="th" x="489" y="512" text-anchor="middle" dominant-baseline="central">Calendar tool</text>
  <text class="ts" x="489" y="530" text-anchor="middle">Check availability</text>
  <text class="ts" x="489" y="548" text-anchor="middle">Book appointment</text>
  <text class="ts" x="489" y="566" text-anchor="middle">Google Calendar</text>
  <text class="ts" x="489" y="584" text-anchor="middle">or CalDAV</text>
</g>

<!-- Arrow: agent → notification layer -->
<line x1="340" y1="624" x2="340" y2="652" class="arr" marker-end="url(#arrow)"/>

<!-- NOTIFICATION LAYER -->
<g class="node c-blue">
  <rect x="170" y="654" width="340" height="56" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="676" text-anchor="middle" dominant-baseline="central">WhatsApp notification</text>
  <text class="ts" x="340" y="696" text-anchor="middle" dominant-baseline="central">Meta Cloud API · pings doctor on confirmed booking</text>
</g>

<!-- Arrow: notification → doctor phone -->
<line x1="340" y1="710" x2="340" y2="756" class="arr" marker-end="url(#arrow)"/>

<!-- Doctor phone -->
<g class="node c-teal">
  <rect x="260" y="758" width="160" height="44" rx="8" stroke-width="0.5"/>
  <text class="th" x="340" y="780" text-anchor="middle" dominant-baseline="central">Doctor's WhatsApp</text>
</g>

<!-- WEBSOCKET label on left side connecting PBX to pipecat -->
<text class="ts" x="96" y="350" text-anchor="middle">WebSocket</text>
<text class="ts" x="96" y="362" text-anchor="middle">RTP audio</text>

</svg>